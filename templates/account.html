{% extends "base.html" %}
{% block title %}Account · SGXray{% endblock %}
{% block content %}
<div class="page wrap auth-page">
  <div class="panel auth-card">
    <p class="eyebrow">{{ current_user.email }}</p>
    <h1>Change your password</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    {% if done %}<p class="form-ok" role="status">{{ done }}</p>{% endif %}
    <form method="post" action="{{ url_for('account') }}" class="auth-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="text" name="username" autocomplete="username" value="{{ current_user.email }}" hidden>
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required maxlength="128">
      <label for="password">New password <span class="hint">at least 12 characters</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
      <label for="password2">Type the new one again</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
    <p class="muted auth-alt">Changing your password logs you out on every other device.</p>
  </div>
</div>
{% endblock %}
