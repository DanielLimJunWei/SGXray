{% extends "base.html" %}
{% block title %}Log in · SGXray{% endblock %}
{% block content %}
<div class="page wrap auth-page">
  <div class="panel auth-card">
    <h1>Log in</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" value="{{ email or '' }}" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="muted auth-alt">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
